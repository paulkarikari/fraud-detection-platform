resources:
  jobs:
    finance_batch_eod:
      name: finance-batch-eod-${var.env}
      max_concurrent_runs: 1
      tags:
        domain: finance
        environment: ${var.env}
        delivery_model: accelerator
      job_clusters:
        - job_cluster_key: standard_etl
          new_cluster:
            spark_version: 14.3.x-scala2.12
            node_type_id: Standard_DS3_v2
            num_workers: 2
            spark_conf:
              spark.databricks.delta.optimizeWrite.enabled: "true"
              spark.databricks.delta.autoCompact.enabled: "true"
      tasks:
        - task_key: bronze_ingest
          job_cluster_key: standard_etl
          spark_python_task:
            python_file: ../src/pipelines/bronze_ingest.py
            parameters:
              - --source-table
              - ${var.catalog_name}.landing.finance_transactions_raw
              - --target-table
              - ${var.catalog_name}.${var.bronze_schema}.finance_transactions
              - --load-mode
              - batch
        - task_key: lakeflow_silver_refresh
          depends_on:
            - task_key: bronze_ingest
          pipeline_task:
            pipeline_id: ${resources.pipelines.finance_transactions_lakeflow.id}
        - task_key: gold_publish
          depends_on:
            - task_key: lakeflow_silver_refresh
          job_cluster_key: standard_etl
          spark_python_task:
            python_file: ../src/pipelines/gold_publish.py
            parameters:
              - --source-table
              - ${var.catalog_name}.${var.silver_schema}.finance_transactions_silver_stream
              - --gold-schema
              - ${var.catalog_name}.${var.gold_schema}

    finance_quality_monitor:
      name: finance-quality-monitor-${var.env}
      max_concurrent_runs: 1
      tags:
        domain: finance
        environment: ${var.env}
        workload: streaming-quality
      tasks:
        - task_key: lakeflow_pipeline
          pipeline_task:
            pipeline_id: ${resources.pipelines.finance_transactions_lakeflow.id}
